[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slurm-scheduler-lab"
version = "0.1.0"
description = "Simulate Slurm multifactor priority and EASY backfill against a job trace before deploying the config."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["slurm", "hpc", "scheduling", "backfill", "gpu", "cluster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
schedlab = "schedlab.cli:main"

[project.urls]
Homepage = "https://github.com/Zhanyl-tech/slurm-scheduler-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/schedlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
