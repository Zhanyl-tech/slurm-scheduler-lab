[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slurm-scheduler-lab"
version = "0.1.0"
description = "Simulate Slurm multifactor priority and backfill against a job trace before deploying the config."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhanyl Abdybaeva" }]
keywords = ["slurm", "hpc", "scheduling", "backfill", "gpu", "cluster"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = []

[project.optional-dependencies]
# PyYAML only lets the fleet loader's YAML subset be checked against PyYAML in
# the tests (tests/test_fleet.py); the package itself stays dependency-free.
dev = ["pytest>=7.0", "ruff>=0.6", "mypy>=1.10", "pyyaml>=6"]

[project.scripts]
schedlab = "schedlab.cli:main"

[project.urls]
Homepage = "https://github.com/Zhanyl-tech/slurm-scheduler-lab"

[tool.hatch.build.targets.wheel]
packages = ["src/schedlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "B",    # bugbear
  "UP",   # pyupgrade (keeps the 3.10 floor honest)
  "SIM",  # simplifications
  "RUF",  # ruff-specific
]
ignore = [
  "RUF001",  # "×" and "→" in strings and docstrings are deliberate
  "RUF002",
  "RUF003",
]

# Strict for the library. Tests are type-checked too, but are not required to
# annotate every helper: that would be churn with no correctness payoff.
[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = "src"

# scripts/s0_table.py --reference imports the sibling k8s lab when it is
# importable; it is never a dependency of this package.
[[tool.mypy.overrides]]
module = ["k8slab", "k8slab.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
